# Project-local rclone config, selected via RCLONE_CONFIG in mise.toml.
# No secrets here:
# - s3 uses the standard AWS credential chain (env vars, ~/.aws).
# - r2 reads RCLONE_CONFIG_R2_ACCESS_KEY_ID / RCLONE_CONFIG_R2_SECRET_ACCESS_KEY,
#   set in the gitignored mise.local.toml.

# Buckets outside us-east-1 need the region overridden, e.g.
#   rclone lsf "s3,region=ap-southeast-1:some-bucket"
[s3]
type = s3
provider = AWS
env_auth = true
region = us-east-1

[r2]
type = s3
provider = Cloudflare
# Same account as wrangler.jsonc
endpoint = https://f184c98e4ba41baaf6a081d9d6e599e6.r2.cloudflarestorage.com
region = auto
no_check_bucket = true
