[tools]
earthly = "0.8.16"
node = "24"
"npm:yarn" = "1.22.22"
aws-cli = { version = "2", symlink_bins = "true" }
wrangler = { version = "4", allow_builds = ["esbuild", "sharp", "workerd"] }
